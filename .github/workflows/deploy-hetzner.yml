name: Deploy portfolio to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Build static Astro site
        env:
          # Public Cloudflare Turnstile site key (not a secret).
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAE8uZBegLmgCl5IR
        run: |
          set -euo pipefail
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Sync static files to Hetzner
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/portfolio_deploy"
          chmod 600 "$HOME/.ssh/portfolio_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          rsync -az --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/portfolio_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ portfolio-deploy@2.29.23.159:/srv/portfolio/public/

      - name: Verify public site is serving this commit
        run: |
          set -euo pipefail
          for path in / /it/ /es/ /privacy/ /it/privacy/ /es/privacy/ /sitemap.xml; do
            curl --fail --silent --show-error --max-time 20 \
              --resolve emmanueledurante.com:443:2.29.23.159 \
              --output /dev/null "https://emmanueledurante.com$path"
          done
          actual="$(curl --fail --silent --show-error --max-time 20 \
            --resolve emmanueledurante.com:443:2.29.23.159 \
            https://emmanueledurante.com/deploy-version.txt)"
          test "$actual" = "$GITHUB_SHA"
