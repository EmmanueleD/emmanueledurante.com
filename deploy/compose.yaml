name: portfolio

services:
  site:
    image: nginx:stable-alpine
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    # Files are built by GitHub Actions and synced as an unprivileged user.
    # No Docker access is granted to the GitHub deployment SSH key.
    volumes:
      - type: bind
        source: /srv/portfolio/public
        target: /usr/share/nginx/html
        read_only: true
    networks:
      - contact-proxy

networks:
  contact-proxy:
    external: true
    name: ${CONTACT_DOCKER_NETWORK:?Set CONTACT_DOCKER_NETWORK in deploy/.env}
